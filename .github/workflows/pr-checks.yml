name: PR checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Zero-dependency invariants. Runs without npm install so a broken lockfile
  # or a registry outage still leaves the most important signal working.
  guardrails:
    name: Guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-guardrails.mjs

  # This repo IS the website: GitHub Pages serves it verbatim, so committing
  # and publishing are the same event and there is no build step to strip
  # anything out. Two scans, because they catch different things.
  secrets:
    name: Secrets and PII
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # gitleaks scans history, not just the tip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Our own rules: the owner's personal data, which gitleaks has no
      # concept of, plus a cheap credential backstop that needs no network.
      - run: node scripts/check-secrets.mjs

      # gitleaks for the maintained credential ruleset. Pinned and fetched as
      # a binary rather than via the action, which gates on a licence key for
      # organisation-owned repos.
      - name: Run gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --config .gitleaks.toml --redact --verbose --exit-code 1

  html:
    name: HTML validity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check:html

  privacy:
    name: Privacy and rendering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check:privacy

  gallery:
    name: Gallery behaviour
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Timing-sensitive: the auto-advance assertions wait real seconds.
      - run: npm run check:gallery
        timeout-minutes: 6

  a11y:
    name: Accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Serve and run pa11y
        run: |
          node scripts/serve.mjs &
          npx wait-on http://localhost:8791 --timeout 30000
          npm run check:a11y
