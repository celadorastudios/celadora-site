<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Celadora Studios</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d0d0d;
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    h1 {
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }
    p {
      color: #888;
      font-size: 1.1rem;
      margin-bottom: 2rem;
    }
    .links a {
      display: inline-block;
      margin: 0 0.75rem;
      color: #f0f0f0;
      text-decoration: none;
      border-bottom: 1px solid #444;
      padding-bottom: 2px;
      transition: border-color 0.2s;
    }
    .links a:hover { border-color: #f0f0f0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Celadora Studios</h1>
    <p>Independent software &amp; tools</p>
    <div class="links">
      <a href="https://github.com/Deklin/claude-o-meter" target="_blank">Claude-O-Meter</a>
      <a href="https://github.com/Deklin" target="_blank">GitHub</a>
    </div>
  </div>
</body>
</html>
