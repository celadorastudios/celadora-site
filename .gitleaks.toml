# gitleaks config for celadora.net
#
# The default ruleset is kept in full; this only records the handful of values
# that are public BY DESIGN, so a real leak is never lost in the noise of the
# same two false positives on every run.
#
# The bar for adding an entry: the value must be one that is meant to be read
# by every visitor's browser. If it grants any write, read or admin access to
# something, it does not belong here, it belongs rotated.

title = "celadora.net"

[extend]
useDefault = true

[allowlist]
description = "Client-side identifiers that are published deliberately"
regexTarget = "match"
regexes = [
  # PostHog PROJECT key. A write-only ingest key that has to ship in browser
  # JavaScript for analytics to work at all; it cannot read data back. Note
  # the prefix: phc_ is the public project key, phx_ is a PERSONAL API key
  # with real access, and phx_ is deliberately NOT allowlisted here (and is
  # caught separately by scripts/check-secrets.mjs).
  '''phc_[A-Za-z0-9]{40,}''',

  # Cloudflare Web Analytics beacon token. Published in the page as a
  # data-cf-beacon attribute by design; it only identifies which site a
  # pageview belongs to.
  '''cf54d1f7a85e4f868e264c4f6b7748fd''',
]

paths = [
  # Vendored third-party libraries and fonts. Not our code, and high-entropy
  # minified bundles trip the generic rules constantly.
  '''^vendor/''',
  '''^node_modules/''',
  # Generated by dc-runtime, carries pinned SRI hashes that look like secrets.
  '''^support\.js$''',
  '''^package-lock\.json$''',
  # Necessarily contains the patterns it hunts for.
  '''^scripts/check-secrets\.mjs$''',
]
